spring:
  application:
    name: ai-gen-web-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_gen_web
    username: root
    password: 12345678
  profiles:
    active:
      - local
  session:
    store-type: redis
    # 30 天过期
    timeout: 2592000

  # redis
  data:
    redis:
      host: localhost
      port: 6379
      ttl: 3600
      password:
      database: 0


server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan:
        - com.leo.aigenweb.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 暗房图床（令牌通过环境变量 DARKROOM_TOKEN 注入；云端由网络代理注入真实令牌，这里用占位符即可）
darkroom:
  base-url: https://leorxx.xyz
  token: ${DARKROOM_TOKEN:proxy-injected}

# 工作流
workflow:
  image-collection:
    # 是否在代码生成工作流中加入“图片收集”步骤（AI 规划图片 + 并发收集素材 + 拼进提示词）。
    # 默认关闭：内容图片来源（Pexels、Pixabay 等）目前都无法申请 API Key，开启前请先确认至少有一个可用的图片来源。
    enabled: false

# 以下为图片收集所用的外部服务，仅在 workflow.image-collection.enabled=true 时才会用到。
# 密钥通过环境变量注入；未配置（为空）时对应工具会直接跳过，不会发出请求。
# Pexels 内容图片搜索
pexels:
  api-key: ${PEXELS_API_KEY:}
# 阿里云百炼 DashScope（Logo 文生图）
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: wan2.2-t2i-flash
