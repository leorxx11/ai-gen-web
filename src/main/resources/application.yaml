spring:
  application:
    name: ai-gen-web-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_gen_web
    username: root
    password: 12345678
  profiles:
    active:
      - local
  session:
    store-type: redis
    # 30 天过期
    timeout: 2592000

  # redis
  data:
    redis:
      host: localhost
      port: 6379
      ttl: 3600
      password:
      database: 0


server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan:
        - com.leo.aigenweb.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 暗房图床（令牌通过环境变量 DARKROOM_TOKEN 注入；云端由网络代理注入真实令牌，这里用占位符即可）
darkroom:
  base-url: https://leorxx.xyz
  token: ${DARKROOM_TOKEN:proxy-injected}
